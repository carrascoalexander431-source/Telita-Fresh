<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telita Fresh - Sistema de Gestión</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: { 50: '#fdfbf7', 100: '#f8f4eb', 200: '#f0e6d2', 300: '#e5d3b3' },
                        wood: { 700: '#5c3d2e', 800: '#422a1d', 900: '#2c1a11' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col justify-between max-w-md mx-auto bg-cream-50 shadow-2xl min-h-screen relative">

    <!-- Header -->
    <header class="bg-gradient-to-r from-wood-900 via-wood-800 to-wood-900 text-amber-50 p-4 sticky top-0 z-30 shadow-md border-b border-amber-900/50">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-full overflow-hidden border-2 border-emerald-400 shadow-md bg-stone-950 flex items-center justify-center">
                    <img src="logo.jpeg" alt="Logo" class="w-full h-full object-cover" onerror="this.parentNode.innerHTML='🧀'">
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-amber-100 font-serif">TELITA FRESH</h1>
                    <p class="text-[11px] text-emerald-400 font-medium">Gestión Integral</p>
                </div>
            </div>
            <button onclick="sincronizarDatos()" title="Sincronizar" class="p-2.5 rounded-full bg-wood-700 hover:bg-wood-600 text-amber-200 transition">
                <i class="fa-solid fa-rotate text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Tasa BCV Bar -->
    <div class="bg-cream-200 px-4 py-2 flex justify-between items-center text-xs shadow-sm border-b border-cream-300">
        <div class="flex items-center gap-2 font-medium text-wood-900">
            <i class="fa-solid fa-building-columns text-emerald-700"></i>
            <span>Tasa BCV:</span>
            <span id="tasaBCVDisplay" class="font-bold text-emerald-800">-- Bs/$</span>
        </div>
        <button onclick="editTasaManual()" class="text-wood-800 underline font-semibold text-[11px]">Editar</button>
    </div>

    <!-- Main Container -->
    <main class="flex-1 p-4 pb-24 overflow-y-auto space-y-4">

        <!-- TAB 1: PEDIDOS -->
        <section id="tab-pedido" class="tab-content space-y-4">
            <div class="border-b pb-2">
                <h2 class="text-base font-bold text-wood-900 flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-emerald-600"></i> Nuevo Pedido</h2>
            </div>
            <form id="formPedido" onsubmit="handleSavePedido(event)" class="space-y-3 bg-white p-4 rounded-2xl border shadow-sm">
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Cliente *</label>
                    <select id="pedidoCliente" required class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs">
                        <option value="">-- Seleccione un cliente --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Producto *</label>
                    <select id="pedidoProducto" required onchange="actualizarPrecioProducto()" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs">
                        <option value="">-- Seleccione un producto --</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Cantidad *</label>
                        <input type="number" id="pedidoCantidad" min="1" value="1" required oninput="calcularTotalPedido()" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Precio Unit. ($) *</label>
                        <input type="number" id="pedidoPrecio" step="0.01" min="0" required oninput="calcularTotalPedido()" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs">
                    </div>
                </div>
                <div class="bg-cream-100 p-3 rounded-xl border border-cream-300 space-y-1 text-xs">
                    <div class="flex justify-between font-medium"><span>Total USD:</span> <span id="resumenUsd" class="font-bold text-emerald-800">$0.00</span></div>
                    <div class="flex justify-between font-medium"><span>Total Bs:</span> <span id="resumenBs" class="font-bold text-amber-900">Bs. 0.00</span></div>
                </div>
                <button type="submit" id="btnPedido" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg text-xs">GUARDAR Y NOTIFICAR PEDIDO</button>
            </form>
        </section>

        <!-- TAB 2: CLIENTES -->
        <section id="tab-clientes" class="tab-content hidden space-y-3">
            <div class="flex justify-between items-center pb-2 border-b">
                <h2 class="text-base font-bold text-wood-900 flex items-center gap-2"><i class="fa-solid fa-users text-emerald-600"></i> Gestión de Clientes</h2>
                <button onclick="prepararNuevoCliente()" class="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-semibold"><i class="fa-solid fa-plus"></i> Nuevo</button>
            </div>
            <input type="text" id="searchCliente" oninput="filterClientes()" placeholder="Buscar por nombre o cédula..." class="w-full bg-white border rounded-xl p-2.5 text-xs shadow-sm">
            <div id="listaClientes" class="space-y-3"></div>
        </section>

        <!-- TAB 3: PRODUCTOS -->
        <section id="tab-productos" class="tab-content hidden space-y-3">
            <div class="flex justify-between items-center pb-2 border-b">
                <h2 class="text-base font-bold text-wood-900 flex items-center gap-2"><i class="fa-solid fa-box text-emerald-600"></i> Catálogo de Productos</h2>
                <button onclick="prepararNuevoProducto()" class="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-semibold"><i class="fa-solid fa-plus"></i> Nuevo</button>
            </div>
            <div id="listaProductos" class="space-y-3"></div>
        </section>

        <!-- TAB 4: CALCULADORA -->
        <section id="tab-calculadora" class="tab-content hidden space-y-4">
            <div class="border-b pb-2"><h2 class="text-base font-bold text-wood-900 flex items-center gap-2"><i class="fa-solid fa-calculator text-emerald-600"></i> Calculadora BCV</h2></div>
            <div class="bg-white p-4 rounded-2xl border space-y-3 text-xs">
                <div><label class="font-semibold">USD ($)</label><input type="number" id="calcUsd" step="0.01" oninput="convertUsd()" class="w-full border p-2.5 rounded-xl font-bold"></div>
                <div><label class="font-semibold">Bolívares (Bs.)</label><input type="number" id="calcBs" step="0.01" oninput="convertBs()" class="w-full border p-2.5 rounded-xl font-bold"></div>
            </div>
        </section>

    </main>

    <!-- MODAL FORMULARIO CLIENTE -->
    <div id="modalCliente" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-2xl">
            <h3 class="font-bold text-wood-900 text-sm">Registrar / Editar Cliente</h3>
            <form id="formClienteModal" onsubmit="guardarCliente(event)" class="space-y-2 text-xs">
                <input type="text" id="mCedula" placeholder="Cédula / RIF (Ej: V-12345678)" required class="w-full border p-2.5 rounded-xl">
                <input type="text" id="mNombre" placeholder="Nombre completo o Empresa" required class="w-full border p-2.5 rounded-xl">
                <input type="tel" id="mTelefono" placeholder="Teléfono WhatsApp" class="w-full border p-2.5 rounded-xl">
                <textarea id="mDireccion" placeholder="Dirección" rows="2" class="w-full border p-2.5 rounded-xl"></textarea>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="cerrarModal('modalCliente')" class="px-3 py-1.5 bg-slate-100 rounded-lg">Cancelar</button>
                    <button type="submit" class="px-4 py-1.5 bg-emerald-600 text-white rounded-lg font-bold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL FORMULARIO PRODUCTO -->
    <div id="modalProducto" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-2xl">
            <h3 class="font-bold text-wood-900 text-sm">Registrar / Modificar Producto</h3>
            <form id="formProductoModal" onsubmit="guardarProducto(event)" class="space-y-2 text-xs">
                <input type="text" id="pCodigo" placeholder="Código (Ej: 1, 2...)" required class="w-full border p-2.5 rounded-xl">
                <input type="text" id="pNombre" placeholder="Nombre del producto" required class="w-full border p-2.5 rounded-xl">
                <input type="number" id="pPrecio" step="0.01" placeholder="Precio en $" required class="w-full border p-2.5 rounded-xl">
                <input type="number" id="pStock" placeholder="Stock" class="w-full border p-2.5 rounded-xl">
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="cerrarModal('modalProducto')" class="px-3 py-1.5 bg-slate-100 rounded-lg">Cancelar</button>
                    <button type="submit" class="px-4 py-1.5 bg-emerald-600 text-white rounded-lg font-bold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-40 transition-all opacity-0 pointer-events-none w-11/12 max-w-xs bg-wood-900 text-white text-xs py-3 px-4 rounded-xl shadow-2xl text-center">Operación exitosa</div>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t py-3 px-6 z-30 flex justify-between items-center shadow-lg">
        <button onclick="switchTab('pedido')" id="nav-pedido" title="Pedidos" class="nav-btn text-emerald-700 text-xl transition transform hover:scale-110">
            <i class="fa-solid fa-cart-shopping"></i>
        </button>
        <button onclick="switchTab('clientes')" id="nav-clientes" title="Clientes" class="nav-btn text-slate-400 text-xl transition transform hover:scale-110">
            <i class="fa-solid fa-users"></i>
        </button>
        <button onclick="switchTab('productos')" id="nav-productos" title="Productos" class="nav-btn text-slate-400 text-xl transition transform hover:scale-110">
            <i class="fa-solid fa-box"></i>
        </button>
        <button onclick="switchTab('calculadora')" id="nav-calculadora" title="Calculadora" class="nav-btn text-slate-400 text-xl transition transform hover:scale-110">
            <i class="fa-solid fa-calculator"></i>
        </button>
    </nav>

    <script>
        const WEB_URL = "https://script.google.com/macros/s/AKfycbzdqQaLDLPpZN4EcNpkMovCik9JbvAZJTZzSf6hGpFu_cDT-63QXoY92kQwqEmcLcoO4Q/exec";
        let tasaBCV = 45.50;
        let clientesData = [];
        let productosData = [];

        document.addEventListener('DOMContentLoaded', () => {
            sincronizarDatos();
            fetchBCV();
        });

        async function fetchBCV() {
            try {
                const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                const data = await res.json();
                if (data && data.promedio) {
                    tasaBCV = parseFloat(data.promedio);
                    document.getElementById('tasaBCVDisplay').textContent = `${tasaBCV.toFixed(2)} Bs/$`;
                }
            } catch(e) {
                document.getElementById('tasaBCVDisplay').textContent = `${tasaBCV.toFixed(2)} Bs/$`;
            }
        }

        function editTasaManual() {
            let t = prompt("Ingrese tasa BCV:", tasaBCV);
            if(t && !isNaN(t)) { tasaBCV = parseFloat(t); document.getElementById('tasaBCVDisplay').textContent = `${tasaBCV.toFixed(2)} Bs/$`; }
        }

        // Método infalible para enviar peticiones POST desde móviles sin bloqueos CORS
        function enviarAccionGoogle(paramsObj) {
            let params = new URLSearchParams(paramsObj);
            let img = document.createElement('img');
            img.src = `${WEB_URL}?${params.toString()}`;
            img.style.display = 'none';
            document.body.appendChild(img);
            setTimeout(() => img.remove(), 2000);
        }

        function sincronizarDatos() {
            showToast("Sincronizando con base de datos...");
            const scriptId = 'jsonp-loader';
            if(document.getElementById(scriptId)) document.getElementById(scriptId).remove();

            window.cbData = function(res) {
                if(res) {
                    clientesData = res.clientes || [];
                    productosData = res.productos || [];
                    renderSelects();
                    renderClientesUI(clientesData);
                    renderProductosUI(productosData);
                    showToast("¡Datos actualizados!");
                }
            }

            let s = document.createElement('script');
            s.id = scriptId;
            s.src = `${WEB_URL}?action=getData&callback=cbData`;
            document.body.appendChild(s);
        }

        function renderSelects() {
            let cSelect = document.getElementById('pedidoCliente');
            cSelect.innerHTML = '<option value="">-- Seleccione un cliente --</option>' + 
                clientesData.map(c => `<option value="${c.cedula}" data-nombre="${c.nombre}">${c.nombre} (${c.cedula})</option>`).join('');

            let pSelect = document.getElementById('pedidoProducto');
            pSelect.innerHTML = '<option value="">-- Seleccione un producto --</option>' + 
                productosData.map(p => `<option value="${p.nombre}">${p.nombre} ($${p.precio})</option>`).join('');
        }

        function renderClientesUI(data) {
            let cont = document.getElementById('listaClientes');
            if(data.length === 0) { cont.innerHTML = '<p class="text-center text-xs text-slate-400 p-4">No hay clientes.</p>'; return; }
            cont.innerHTML = data.map((c, index) => `
                <div class="bg-white p-3 rounded-2xl border shadow-sm flex justify-between items-center text-xs">
                    <div>
                        <h3 class="font-bold text-wood-900">${c.nombre}</h3>
                        <p class="text-emerald-700 font-semibold">${c.cedula}</p>
                        <p class="text-slate-500">${c.telefono || 'Sin teléfono'} - ${c.direccion || ''}</p>
                    </div>
                    <div class="flex gap-1.5">
                        <button onclick='editarCliente(${JSON.stringify(c)})' class="bg-amber-100 text-amber-900 p-2 rounded-xl" title="Editar"><i class="fa-solid fa-pen"></i></button>
                        <button onclick='eliminarCliente(${index + 2}, "${c.nombre}")' class="bg-rose-100 text-rose-700 p-2 rounded-xl" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderProductosUI(data) {
            let cont = document.getElementById('listaProductos');
            if(data.length === 0) { cont.innerHTML = '<p class="text-center text-xs text-slate-400 p-4">No hay productos.</p>'; return; }
            cont.innerHTML = data.map((p, index) => `
                <div class="bg-white p-3 rounded-2xl border shadow-sm flex justify-between items-center text-xs">
                    <div>
                        <h3 class="font-bold text-wood-900">${p.nombre} (Cód: ${p.codigo})</h3>
                        <p class="text-emerald-700 font-bold">$${p.precio} USD</p>
                    </div>
                    <div class="flex gap-1.5">
                        <button onclick='editarProducto(${JSON.stringify(p)})' class="bg-amber-100 text-amber-900 p-2 rounded-xl" title="Editar"><i class="fa-solid fa-pen"></i></button>
                        <button onclick='eliminarProducto(${index + 2}, "${p.nombre}")' class="bg-rose-100 text-rose-700 p-2 rounded-xl" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function filterClientes() {
            let q = document.getElementById('searchCliente').value.toLowerCase();
            let filtered = clientesData.filter(c => c.nombre.toLowerCase().includes(q) || c.cedula.toLowerCase().includes(q));
            renderClientesUI(filtered);
        }

        function actualizarPrecioProducto() {
            let prodName = document.getElementById('pedidoProducto').value;
            let found = productosData.find(p => p.nombre === prodName);
            if(found) { document.getElementById('pedidoPrecio').value = found.precio; calcularTotalPedido(); }
        }

        function calcularTotalPedido() {
            let cant = parseFloat(document.getElementById('pedidoCantidad').value) || 0;
            let price = parseFloat(document.getElementById('pedidoPrecio').value) || 0;
            let totalU = cant * price;
            let totalB = totalU * tasaBCV;
            document.getElementById('resumenUsd').textContent = `$${totalU.toFixed(2)}`;
            document.getElementById('resumenBs').textContent = `Bs. ${totalB.toFixed(2)}`;
        }

        function prepararNuevoCliente() {
            document.getElementById('formClienteModal').reset();
            document.getElementById('mCedula').disabled = false;
            document.getElementById('modalCliente').classList.remove('hidden');
        }
        function editarCliente(c) {
            document.getElementById('mCedula').value = c.cedula;
            document.getElementById('mCedula').disabled = true;
            document.getElementById('mNombre').value = c.nombre;
            document.getElementById('mTelefono').value = c.telefono;
            document.getElementById('mDireccion').value = c.direccion;
            document.getElementById('modalCliente').classList.remove('hidden');
        }

        function prepararNuevoProducto() {
            document.getElementById('formProductoModal').reset();
            document.getElementById('pCodigo').disabled = false;
            document.getElementById('modalProducto').classList.remove('hidden');
        }
        function editarProducto(p) {
            document.getElementById('pCodigo').value = p.codigo;
            document.getElementById('pCodigo').disabled = true;
            document.getElementById('pNombre').value = p.nombre;
            document.getElementById('pPrecio').value = p.precio;
            document.getElementById('pStock').value = p.stock;
            document.getElementById('modalProducto').classList.remove('hidden');
        }

        function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }

        function guardarCliente(e) {
            e.preventDefault();
            enviarAccionGoogle({
                action: 'guardarCliente',
                cedula: document.getElementById('mCedula').value,
                nombre: document.getElementById('mNombre').value,
                telefono: document.getElementById('mTelefono').value,
                direccion: document.getElementById('mDireccion').value
            });
            cerrarModal('modalCliente');
            showToast("¡Cliente guardado en Google Sheets!");
            setTimeout(sincronizarDatos, 1500);
        }

        function eliminarCliente(fila, nombre) {
            if(confirm(`¿Estás seguro de eliminar al cliente: ${nombre}?`)) {
                enviarAccionGoogle({ action: 'eliminarCliente', fila: fila });
                showToast("Cliente eliminado");
                setTimeout(sincronizarDatos, 1500);
            }
        }

        function guardarProducto(e) {
            e.preventDefault();
            enviarAccionGoogle({
                action: 'guardarProducto',
                codigo: document.getElementById('pCodigo').value,
                nombre: document.getElementById('pNombre').value,
                precio: document.getElementById('pPrecio').value,
                stock: document.getElementById('pStock').value || 0
            });
            cerrarModal('modalProducto');
            showToast("¡Producto guardado en Google Sheets!");
            setTimeout(sincronizarDatos, 1500);
        }

        function eliminarProducto(fila, nombre) {
            if(confirm(`¿Estás seguro de eliminar el producto: ${nombre}?`)) {
                enviarAccionGoogle({ action: 'eliminarProducto', fila: fila });
                showToast("Producto eliminado");
                setTimeout(sincronizarDatos, 1500);
            }
        }

        function handleSavePedido(e) {
            e.preventDefault();
            let selC = document.getElementById('pedidoCliente');
            let cedula = selC.value;
            let nombre = selC.options[selC.selectedIndex].getAttribute('data-nombre');
            let prod = document.getElementById('pedidoProducto').value;
            let cant = document.getElementById('pedidoCantidad').value;
            let precio = document.getElementById('pedidoPrecio').value;

            enviarAccionGoogle({
                action: 'nuevoPedido',
                cedulaCliente: cedula,
                nombreCliente: nombre,
                productos: `${cant}x ${prod} ($${precio} c/u)`,
                totalUsd: (cant * precio).toFixed(2),
                totalBs: ((cant * precio) * tasaBCV).toFixed(2),
                fecha: new Date().toLocaleString()
            });

            showToast("¡Pedido registrado y notificado!");
            document.getElementById('formPedido').reset();
            document.getElementById('resumenUsd').textContent = "$0.00";
            document.getElementById('resumenBs').textContent = "Bs. 0.00";
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.className = "nav-btn text-slate-400 text-xl transition transform hover:scale-110");
            document.getElementById(`nav-${tab}`).className = "nav-btn text-emerald-700 text-xl transition transform hover:scale-110 font-bold";
        }

        function showToast(msg) {
            let t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => t.classList.add('opacity-0', 'pointer-events-none'), 3000);
        }

        function convertUsd() {
            let u = parseFloat(document.getElementById('calcUsd').value) || 0;
            document.getElementById('calcBs').value = (u * tasaBCV).toFixed(2);
        }
        function convertBs() {
            let b = parseFloat(document.getElementById('calcBs').value) || 0;
            document.getElementById('calcUsd').value = (b / tasaBCV).toFixed(2);
        }
    </script>
</body>
</html>
